openapi: 3.1.0
info:
  title: PostFinanceCo API
  version: 1.0.0
  description: |
    The PostFinanceCo API makes it easy to manage transaction and account data. 
    
    ## Features
    - **Account Management**: Create and read bank accounts
    - **Transaction Processing**: Transfer funds between accounts or deposit to accounts
    - **Multiple Currencies**: Support for POST_COINS, POST_GOLD, and POST_BUCKS
    - **API Key Authentication**: Secure endpoints with API key validation
    - **Rate Limiting**: 300 requests per minute per API key
    
  license:
    name: ISC
    url: https://opensource.org/licenses/ISC

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.postfinanceco.example.com
    description: Production server
  - url: https://template.postman-echo.com
    description: Demo server

tags:
  - name: Admin
    description: Administrative operations including API key management
  - name: Accounts
    description: |
      Account management operations. An account at the PostFinanceCo allows you to store funds.
      Use these endpoints to list, create, update, and delete accounts.
  - name: Transactions
    description: |
      Transaction operations. A transaction records money moving in or out of an account.

security:
  - ApiKeyAuth: []

paths:
  /api/v1/auth:
    get:
      tags:
        - Admin
      summary: Generate API key
      description: |
        Generates a new API key for accessing the PostFinanceCo APIs.
      operationId: generateApiKey
      security: 
        - BasicAuth: []
      responses:
        '200':
          description: Successful API key generation
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                type: object
                required:
                  - apiKey
                properties:
                  apiKey:
                    type: string
                    description: The generated API key
                    example: "123456789"
              example:
                apiKey: "123456789"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/accounts:
    post:
      tags:
        - Accounts
      summary: Create new account
      description: |
        Creates a new account at PostFinanceCo. The account will be assigned a unique ID.
        The currency cannot be changed once the account is created.
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
            examples:
              withBalance:
                summary: Create account with initial balance
                value:
                  owner: "Nora Newman"
                  balance: 500
                  currency: "POST_GOLD"
              withoutBalance:
                summary: Create account with zero balance
                value:
                  owner: "Nora Newman"
                  currency: "POST_GOLD"
      responses:
        '201':
          description: Account created successfully
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                type: object
                required:
                  - account
                properties:
                  account:
                    type: object
                    required:
                      - accountId
                    properties:
                      accountId:
                        type: string
                        description: The unique identifier of the created account
              example:
                account:
                  accountId: "123"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Accounts
      summary: List all accounts
      description: |
        Retrieves a list of all accounts at PostFinanceCo. 
        Optionally filter by owner name or creation date.
      operationId: listAccounts
      parameters:
        - name: owner
          in: query
          description: Filter accounts by owner's full name
          required: false
          schema:
            type: string
          example: ""
      responses:
        '200':
          description: Successful response with list of accounts
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                type: object
                required:
                  - accounts
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
              examples:
                withResults:
                  summary: Accounts found
                  value:
                    accounts:
                      - accountId: "123"
                        owner: "Nova Newman"
                        createdAt: "2023-04-10"
                        balance: 10000
                        currency: "POST_COINS"
                      - accountId: "124"
                        owner: "Gary Galaxy"
                        createdAt: "2023-04-10"
                        balance: 237
                        currency: "POST_COINS"
                noResults:
                  summary: No accounts found
                  value:
                    accounts: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
    


  /api/v1/transactions:
    get:
      tags:
        - Transactions
      summary: List all transactions
      description: |
        Retrieves a list of transactions.
      operationId: listTransactions
      parameters:
        - name: accountId
          in: query
          description: Filter transactions by source account ID
          required: true
          schema:
            type: string
          example: "123"
      responses:
        '200':
          description: Successful response with list of transactions
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                type: object
                required:
                  - transactions
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
              examples:
                withResults:
                  summary: Transactions found
                  value:
                    transactions:
                      - transactionId: "1"
                        createdAt: "2024-01-10"
                        amount: 94857902
                        currency: "POST_GOLD"
                        accountId: "123"
                        transactionType: "DEPOSIT"
                      - transactionId: "2"
                        createdAt: "2024-01-10"
                        amount: 94857902
                        currency: "POST_GOLD"
                        accountId: "123"
                        transactionType: "WITHDRAWAL"
                noResults:
                  summary: No transactions found
                  value:
                    transactions: []
        '400':
          $ref: '#/components/responses/TransactionValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Transactions
      summary: Create new transaction
      description: |
        Creates a new transaction. There are two types of transactions:
        - **Deposit**: Add money to an account by setting transactionType to "DEPOSIT"
        - **Withdrawal**: Remove money from an account by setting transactionType to "WITHDRAWAL"

        **Important**: Transactions cannot be edited or deleted once created.
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
            examples:
              deposit:
                summary: Deposit to account
                value:
                  accountId: "123"
                  amount: 10000
                  currency: "POST_GOLD"
                  transactionType: "DEPOSIT"
              withdrawal:
                summary: Withdraw from account
                value:
                  accountId: "123"
                  amount: 10000
                  currency: "POST_GOLD"
                  transactionType: "WITHDRAWAL"
      responses:
        '201':
          description: Transaction created successfully
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                type: object
                required:
                  - transaction
                properties:
                  transaction:
                    type: object
                    required:
                      - transactionId
                    properties:
                      transactionId:
                        type: string
                        description: The unique identifier of the created transaction
              example:
                transaction:
                  transactionId: "1"
        '400':
          $ref: '#/components/responses/TransactionValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientFunds'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/transactions/{transactionId}:
    get:
      tags:
        - Transactions
      summary: Get transaction by ID
      description: Retrieves detailed information about a specific transaction by its ID.
      operationId: getTransaction
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Transaction details retrieved successfully
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                type: object
                required:
                  - transaction
                properties:
                  transaction:
                    $ref: '#/components/schemas/Transaction'
              example:
                transaction:
                  transactionId: "1"
                  createdAt: "2024-01-10"
                  amount: 10000
                  currency: "POST_COINS"
                  accountId: "123"
                  transactionType: "DEPOSIT"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TransactionNotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        API key for authentication. Include your API key in the `x-api-key` header.
        Generate a new API key using the `/api/v1/auth` endpoint.
        
        Admin operations require the admin credentials.
    BasicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic authentication. Provide a base64-encoded `username:password`
        in the `Authorization` header.
 
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      description: The unique identifier of the account
      schema:
        type: string
      example: "123"
    
    TransactionId:
      name: transactionId
      in: path
      required: true
      description: The unique identifier of the transaction
      schema:
        type: string
      example: "1"

  headers:
    X-RateLimit-Limit:
      description: The maximum number of requests permitted per minute
      schema:
        type: integer
        example: 300
    
    X-RateLimit-Remaining:
      description: The number of requests remaining in the current rate limit window
      schema:
        type: integer
        example: 299
    
    X-RateLimit-Reset:
      description: The time at which the current rate limit window resets (UTC epoch seconds)
      schema:
        type: integer
        example: 1678901234

  schemas:
    Account:
      type: object
      required:
        - accountId
        - owner
        - createdAt
        - balance
        - currency
      properties:
        accountId:
          type: string
          description: Unique identifier for the account
          example: "1"
        owner:
          type: string
          description: Full name of the account owner
          minLength: 1
          example: "Nova Newman"
        createdAt:
          type: string
          format: date
          description: Date the account was created (YYYY-MM-DD)
          example: "2023-04-10"
        balance:
          type: number
          format: double
          description: Current account balance
          minimum: 0
          example: 10000
        currency:
          type: string
          description: Currency type for the account
          enum:
            - POST_COINS
            - POST_GOLD
            - POST_BUCKS
          example: "POST_COINS"
    
    CreateAccountRequest:
      type: object
      required:
        - owner
        - currency
      properties:
        owner:
          type: string
          description: Full name of the account owner
          minLength: 1
          example: "Nova Newman"
        balance:
          type: number
          format: double
          description: Initial account balance (defaults to 0 if not provided)
          minimum: 0
          default: 0
          example: 500
        currency:
          type: string
          description: Currency type for the account (cannot be changed after creation)
          enum:
            - POST_COINS
            - POST_GOLD
            - POST_BUCKS
          example: "POST_COINS"
    
    UpdateAccountRequest:
      type: object
      required:
        - owner
      properties:
        owner:
          type: string
          description: Updated full name of the account owner
          minLength: 1
          example: "Nova Newman"
    
    Transaction:
      type: object
      required:
        - transactionId
        - createdAt
        - amount
        - currency
        - accountId
        - transactionType
      properties:
        transactionId:
          type: string
          description: Unique identifier for the transaction
          example: "{transactionId}"
        createdAt:
          type: string
          format: date
          description: Date the transaction was created (YYYY-MM-DD)
          example: "2024-01-10"
        amount:
          type: number
          format: double
          description: Transaction amount
          minimum: 0
          exclusiveMinimum: true
          example: 10000
        currency:
          type: string
          description: Currency type for the transaction
          enum:
            - POST_COINS
            - POST_GOLD
            - POST_BUCKS
          example: "POST_COINS"
        accountId:
          type: string
          description: Account ID
          example: "1"
        transactionType:
          $ref: '#/components/schemas/TransactionType'

    CreateTransactionRequest:
      type: object
      required:
        - accountId
        - amount
        - currency
        - transactionType
      properties:
        accountId:
          type: string
          description: Account ID
          example: "12345678"
        amount:
          $ref: '#/components/schemas/AmountDetails'
        currency:
          type: string
          description: Currency type (must match account currencies)
          enum:
            - POST_COINS
            - POST_GOLD
            - POST_BUCKS
          example: "POST_COINS"
        transactionType:
          $ref: '#/components/schemas/TransactionType'
    AmountDetails:
      type: number
      format: double
      description: Transaction amount (must be positive)
      minimum: 0
      exclusiveMinimum: true
      example: 10000
    TransactionType:  
      type: string
      description: Type of transaction (deposit / withdrawal)
      enum:
        - WITHDRAWAL
        - DEPOSIT
      example: "DEPOSIT" 
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - name
            - message
          properties:
            name:
              type: string
              description: Error type identifier
              example: "validationError"
            message:
              type: string
              description: Human-readable error message
              example: "Owner name is required and must be a string"

  responses:
    Unauthorized:
      description: Authentication required or API key invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              name: "authenticationError"
              message: "API key is required. Please provide an API key in the x-api-key header."
    
    Forbidden:
      description: Insufficient permissions to perform this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            adminRequired:
              summary: Admin access required
              value:
                error:
                  name: "forbiddenError"
                  message: "You do not have permissions to perform this action. Admin access required."
            accountPermission:
              summary: Account permission denied
              value:
                error:
                  name: "forbiddenError"
                  message: "You do not have permissions to update this account."
    
    AccountNotFound:
      description: The specified account does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              name: "instanceNotFoundError"
              message: "The specified account does not exist."
    
    TransactionNotFound:
      description: The specified transaction does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              name: "instanceNotFoundError"
              message: "The specified transaction does not exist."
    TransactionValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            value:
              error:
                name: "validationError"
                message: "Unable to validate the request body"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingField:
              summary: Missing required field
              value:
                error:
                  name: "validationError"
                  message: "Owner name is required and must be a string"
            invalidCurrency:
              summary: Invalid currency
              value:
                error:
                  name: "validationError"
                  message: "Currency must be one of: POST_COINS, POST_GOLD, POST_BUCKS"
            negativeAmount:
              summary: Invalid amount
              value:
                error:
                  name: "validationError"
                  message: "Amount must be a positive number"
    
    InsufficientFunds:
      description: Insufficient funds to complete the transaction
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              name: "txInsufficientFunds"
              message: "Not enough funds in source account to complete transaction."
    
    RateLimitExceeded:
      description: Too many requests - rate limit exceeded
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          schema:
            type: integer
            example: 0
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              name: "rateLimitExceeded"
              message: "Too many requests. Maximum 300 requests per minute allowed."
    
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              name: "serverError"
              message: "An unexpected error occurred"

