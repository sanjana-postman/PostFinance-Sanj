$kind: http-request
description: |
  Creates a new account at PostFinanceCo. The account will be assigned a unique ID.
  The currency cannot be changed once the account is created.
url: "{{baseUrl}}/api/v1/accounts"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "owner": "{{accountName}}",
      "balance": 500,
      "currency": "POST_GOLD"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "owner": {
          "type": "string",
          "minLength": 1,
          "example": "Nova Newman",
          "description": "Full name of the account owner"
        },
        "balance": {
          "type": "number",
          "minimum": 0,
          "example": 500,
          "description": "Initial account balance (defaults to 0 if not provided)",
          "format": "double"
        },
        "currency": {
          "type": "string",
          "enum": [
            "POST_COINS",
            "POST_GOLD",
            "POST_BUCKS"
          ],
          "example": "POST_COINS",
          "description": "Currency type for the account (cannot be changed after creation)"
        }
      },
      "required": [
        "owner",
        "currency"
      ]
    }
scripts:
  - type: beforeRequest
    code: |-
      // Set accountName: use environment value if present, otherwise generate a random full name
      const envAccountName = pm.environment.get('accountName');
      if (envAccountName) {
          pm.collectionVariables.set('accountName', envAccountName);
      } else {
          pm.collectionVariables.set('accountName', pm.variables.replaceIn('{{$randomFullName}}'));
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      // Contract tests: Create new account (POST /api/v1/accounts)
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      const schema = {
          type: "object",
          required: ["account"],
          properties: {
              account: {
                  type: "object",
                  required: ["accountId"],
                  properties: {
                      accountId: { type: "string" }
                  }
              }
          }
      };

      pm.test("Response body matches create-account schema", function () {
          pm.response.to.have.jsonSchema(schema);
      });

      pm.test("Response time is under 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      // Capture accountId for downstream chaining
      if (pm.response.code >= 200 && pm.response.code < 300) {
          const response = pm.response.json();
          pm.collectionVariables.set("accountId", response.account.accountId);
      }
    language: text/javascript
examples: ./.resources/Create new account.resources/examples
order: 2000
