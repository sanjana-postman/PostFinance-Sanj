  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  queryParams:
    - key: owner
      value: ""
      description: Filter accounts by owner's full name
  body:
    type: text
    content: ""
