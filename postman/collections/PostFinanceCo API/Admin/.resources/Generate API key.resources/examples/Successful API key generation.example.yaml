$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/auth"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Basic <credentials>
      description: "Added as a part of security scheme: basic"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
    X-RateLimit-Limit: ""
    X-RateLimit-Remaining: ""
    X-RateLimit-Reset: ""
  body:
    type: json
    content: |-
      {
        "apiKey": "123456789"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "apiKey": {
            "type": "string",
            "example": "123456789",
            "description": "The generated API key"
          }
        },
        "required": [
          "apiKey"
        ]
      }
order: 1000
