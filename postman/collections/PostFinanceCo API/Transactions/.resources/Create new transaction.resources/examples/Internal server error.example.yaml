$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/transactions"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "accountId": "<string>",
        "amount": 10000,
        "currency": "POST_COINS",
        "transactionType": "WITHDRAWAL"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "name": "serverError",
          "message": "An unexpected error occurred"
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "object",
            "properties": {
              "name": {
                "type": "string",
                "example": "validationError",
                "description": "Error type identifier"
              },
              "message": {
                "type": "string",
                "example": "Owner name is required and must be a string",
                "description": "Human-readable error message"
              }
            },
            "required": [
              "name",
              "message"
            ]
          }
        },
        "required": [
          "error"
        ]
      }
order: 7000
