$kind: http-request
description: |
  Retrieves a list of transactions.
url: "{{baseUrl}}/api/v1/transactions?accountId={{accountId}}"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: accountId
    value: "{{accountId}}"
    description: Filter transactions by source account ID
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
scripts:
  - type: afterResponse
    code: |-
      // Contract tests: List all transactions (GET /api/v1/transactions?accountId=...)
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      const schema = {
          type: "object",
          required: ["transactions"],
          properties: {
              transactions: {
                  type: "array",
                  items: {
                      type: "object",
                      required: ["transactionId", "createdAt", "amount", "currency", "accountId", "transactionType"],
                      properties: {
                          transactionId: { type: "string" },
                          createdAt: { type: "string" },
                          amount: { type: "number", minimum: 0 },
                          currency: { type: "string", enum: ["POST_COINS", "POST_GOLD", "POST_BUCKS"] },
                          accountId: { type: "string" },
                          transactionType: { type: "string", enum: ["WITHDRAWAL", "DEPOSIT"] }
                      }
                  }
              }
          }
      };

      pm.test("Response body matches transactions-list schema", function () {
          pm.response.to.have.jsonSchema(schema);
      });

      pm.test("transactions payload is an array", function () {
          pm.expect(pm.response.json().transactions).to.be.an("array");
      });

      pm.test("Response time is under 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
    language: text/javascript
examples: ./.resources/List all transactions.resources/examples
order: 1000
