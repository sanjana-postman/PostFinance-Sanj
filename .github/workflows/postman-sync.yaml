name: Sync to Postman Cloud

on:
  pull_request:
    types:
      - closed

jobs:
  sync-postman:
    name: Sync to Postman Cloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install dependencies
        run: uv sync --locked

      - name: Start API server
        run: |
          nohup uv run fastapi run main.py --port 8000 > server.log 2>&1 &
          disown

      - name: Wait for API server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready within 30s" >&2
          echo "----- server.log -----"
          cat server.log
          exit 1

      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Run API tests
        run: |
          postman collection run "52921466-b999a15e-2fe6-4a95-98cc-493fde050759" -e "52921466-573b0dc3-ee35-406f-8958-3d28c4c261d2" --reporter-cli-no-success-assertions --report-events
          postman collection run "52921466-b999a15e-2fe6-4a95-98cc-493fde050759" -e "52921466-3469d6d9-a983-4f00-9a99-40f3c25d7d8f" --reporter-cli-no-success-assertions --report-events
        
      - name: Push local changes to Postman workspace
        run: postman workspace push -y --verbose